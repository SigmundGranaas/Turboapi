name: turbo

# Modulith deployment: a single Turbo.Host.Modulith process binding all three
# modules against a single Postgres (three schemas — auth/geo/activity). The
# gateway runs in Modulith topology so /api/auth/*, /api/geo/*, /api/activity/*
# all forward to the one host. No NATS — events flow in-process inside the host.
#
# Usage:
#   docker compose -f compose.yaml -f compose.utils.yaml -f compose.modulith.yaml up
#
# (compose.yaml supplies the Postgres + NATS infrastructure containers; the
#  modulith deploy ignores NATS, but compose.yaml is still the canonical
#  source for the database containers.)

services:
  turboapi-modulith:
    build:
      context: .
      dockerfile: ./hosts/Turbo.Host.Modulith/Dockerfile
    container_name: turboapi_modulith
    hostname: modulith
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Auth=Host=${AUTH_DB_HOST:-auth-db};Port=${AUTH_DB_PORT:-5432};Database=${AUTH_DB_NAME:-auth};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-yourpassword}
      - ConnectionStrings__Geo=Host=${GEO_DB_HOST:-geo-db};Port=${GEO_DB_PORT:-5435};Database=${GEO_DB_NAME:-geo};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-yourpassword}
      - ConnectionStrings__Activity=Host=${ACTIVITY_DB_HOST:-activity-db};Port=${ACTIVITY_DB_PORT:-5436};Database=${ACTIVITY_DB_NAME:-activity};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-yourpassword}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=turboapi-modulith
    depends_on:
      auth-db-migration:
        condition: service_completed_successfully
      geo-db-migration:
        condition: service_completed_successfully
      activity-db-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - turbo

  turboapi-gateway:
    build:
      context: .
      dockerfile: ./src/Gateway/Dockerfile
    container_name: turboapi_gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Topology=Modulith
    depends_on:
      turboapi-modulith:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - turbo

  # Flyway's -connectRetries handles waiting for Postgres; the migration
  # containers are deliberately topology-agnostic so the same definition
  # works against per-service DBs or the shared-db variant.
  auth-db-migration:
    image: flyway/flyway:latest
    command: -url=jdbc:postgresql://${AUTH_DB_HOST:-auth-db}:${AUTH_DB_PORT:-5432}/${AUTH_DB_NAME:-auth} -user=${DB_USER:-postgres} -password=${DB_PASSWORD:-yourpassword} -locations=filesystem:/flyway/sql -connectRetries=30 -baselineOnMigrate=true migrate
    volumes:
      - ./src/Auth/db/migrations:/flyway/sql
    networks:
      - turbo

  geo-db-migration:
    image: flyway/flyway:latest
    command: -url=jdbc:postgresql://${GEO_DB_HOST:-geo-db}:${GEO_DB_PORT:-5435}/${GEO_DB_NAME:-geo} -user=${DB_USER:-postgres} -password=${DB_PASSWORD:-yourpassword} -locations=filesystem:/flyway/sql -connectRetries=30 -baselineOnMigrate=true migrate
    volumes:
      - ./src/Geo/db/migrations:/flyway/sql
    networks:
      - turbo

  activity-db-migration:
    image: flyway/flyway:latest
    command: -url=jdbc:postgresql://${ACTIVITY_DB_HOST:-activity-db}:${ACTIVITY_DB_PORT:-5436}/${ACTIVITY_DB_NAME:-activity} -user=${DB_USER:-postgres} -password=${DB_PASSWORD:-yourpassword} -locations=filesystem:/flyway/sql -connectRetries=30 -baselineOnMigrate=true migrate
    volumes:
      - ./src/Activity/db/migrations:/flyway/sql
    networks:
      - turbo
